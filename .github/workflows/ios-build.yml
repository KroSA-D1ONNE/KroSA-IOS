name: KroSA iOS Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/librw-geometry-eagl]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install CMake and XcodeGen
        run: brew install cmake xcodegen

      - name: Fetch pinned librw source
        run: |
          mkdir -p vendor/librw
          git -C vendor/librw init
          git -C vendor/librw remote add origin https://github.com/aap/librw.git
          git -C vendor/librw fetch --depth 1 origin 18532c2e13efbc1aa43f0b00b4459831f9414de0
          git -C vendor/librw checkout FETCH_HEAD

      - name: Apply native iOS EAGL backend to librw
        run: python3 scripts/patch-librw-eagl.py

      - name: Build librw GL3 backend for iOS arm64
        run: |
          cmake -S vendor/librw -B build/librw-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.1 \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${{ github.workspace }}/build/librw-ios/lib \
            -DLIBRW_PLATFORM=GL3 \
            -DLIBRW_GL3_GFXLIB=EAGL \
            -DLIBRW_TOOLS=OFF \
            -DLIBRW_INSTALL=OFF
          cmake --build build/librw-ios --config Release --parallel 2
          test -f build/librw-ios/lib/librw.a

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Preserve device librw archive
        run: |
          cp build/librw-ios/lib/librw.a build/librw-device.a

      - name: Build librw GL3 backend for iOS Simulator arm64
        run: |
          cmake -S vendor/librw -B build/librw-simulator \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.1 \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${{ github.workspace }}/build/librw-simulator/lib \
            -DLIBRW_PLATFORM=GL3 \
            -DLIBRW_GL3_GFXLIB=EAGL \
            -DLIBRW_TOOLS=OFF \
            -DLIBRW_INSTALL=OFF
          cmake --build build/librw-simulator --config Release --parallel 2
          test -f build/librw-simulator/lib/librw.a
          cp build/librw-simulator/lib/librw.a build/librw-ios/lib/librw.a

      - name: Run GPU smoke test in iOS Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")]; print(xs[0]["udid"] if xs else "")')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No hay un simulador iPhone disponible en el runner"
            exit 1
          fi
          echo "Usando simulador: $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -project KroSA.xcodeproj \
            -scheme KroSA \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/SimulatorDerivedData \
            -resultBundlePath build/KroSA-Simulator.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KroSA-simulator-diagnostics
          path: |
            build/KroSA-Simulator.xcresult
            ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore
          retention-days: 7

      - name: Restore device librw library after simulator test
        run: |
          cp build/librw-device.a build/librw-ios/lib/librw.a
          file build/librw-ios/lib/librw.a

      - name: Build for iOS
        run: |
          xcodebuild \
            -project KroSA.xcodeproj \
            -scheme KroSA \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/KroSA.app build/Payload/
          cd build
          /usr/bin/zip -qry KroSA-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KroSA-unsigned-IPA
          path: build/KroSA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
